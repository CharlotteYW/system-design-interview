server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    proxy_read_timeout 8s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $search_upstream http://search:8000;
    set $business_upstream http://business:8000;

    location = /v1/nearby {
        proxy_pass $search_upstream;
    }
    location /v1/businesses {
        proxy_pass $business_upstream;
    }
    location /lab/ {
        proxy_pass $business_upstream;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
