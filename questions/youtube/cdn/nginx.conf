# A two-tier CDN in one nginx process.
#   Shield (8390): one regional cache in front of the MinIO origin.
#   Edges A, B (8301, 8302): ask the shield on a miss.
#   Edges C, D (8303, 8304): no shield. Ask the origin directly on a miss.
#   Slow edge (8305): behind the shield, rate limited, to make the player pick a low rendition.
# proxy_cache_lock collapses simultaneous misses for one object into one upstream request.
worker_processes 2;
events { worker_connections 1024; }

http {
  log_format cdn escape=json '{"port":"$server_port","uri":"$request_uri","cache":"$upstream_cache_status","status":"$status"}';
  access_log /logs/cdn.log cdn;

  proxy_cache_path /var/cache/nginx/shield keys_zone=shield:10m max_size=2g inactive=1d use_temp_path=off;
  proxy_cache_path /var/cache/nginx/edge_a keys_zone=edge_a:10m max_size=1g inactive=1d use_temp_path=off;
  proxy_cache_path /var/cache/nginx/edge_b keys_zone=edge_b:10m max_size=1g inactive=1d use_temp_path=off;
  proxy_cache_path /var/cache/nginx/edge_c keys_zone=edge_c:10m max_size=1g inactive=1d use_temp_path=off;
  proxy_cache_path /var/cache/nginx/edge_d keys_zone=edge_d:10m max_size=1g inactive=1d use_temp_path=off;
  proxy_cache_path /var/cache/nginx/edge_s keys_zone=edge_s:10m max_size=1g inactive=1d use_temp_path=off;

  resolver 127.0.0.11 valid=10s;   # Docker DNS, needed because proxy_pass uses a variable
  proxy_cache_lock on;
  proxy_cache_lock_timeout 10s;
  proxy_cache_key $request_uri;
  proxy_ignore_headers Cache-Control Expires Set-Cookie;
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Expose-Headers;
  proxy_hide_header Vary;
  proxy_set_header Origin "";

  # Origin shield
  server {
    listen 8390;
    location ~ \.m3u8$ {
      proxy_pass http://minio:9000;
      proxy_set_header Host minio:9000;
      proxy_cache shield;
      proxy_cache_valid 200 2s;   # manifests change while renditions are added
      add_header X-Shield-Cache $upstream_cache_status always;
    }
    location / {
      proxy_pass http://minio:9000;
      proxy_set_header Host minio:9000;
      proxy_cache shield;
      proxy_cache_valid 200 1d;   # a segment never changes
      add_header X-Shield-Cache $upstream_cache_status always;
    }
  }

  map $server_port $edge_upstream {
    8301 http://127.0.0.1:8390;
    8302 http://127.0.0.1:8390;
    8305 http://127.0.0.1:8390;
    default http://minio:9000;
  }

  server {
    listen 8301; listen 8302; listen 8303; listen 8304; listen 8305;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Expose-Headers "X-Edge-Cache, X-Shield-Cache, X-Edge" always;
    add_header X-Edge $server_port always;

    set $zone edge_a;
    if ($server_port = 8302) { set $zone edge_b; }
    if ($server_port = 8303) { set $zone edge_c; }
    if ($server_port = 8304) { set $zone edge_d; }
    if ($server_port = 8305) { set $zone edge_s; }

    location ~ \.m3u8$ {
      if ($server_port = 8305) { set $limit_rate 100k; }
      proxy_pass $edge_upstream;
      proxy_set_header Host minio:9000;
      proxy_cache $zone;
      proxy_cache_valid 200 2s;
      add_header X-Edge-Cache $upstream_cache_status always;
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Expose-Headers "X-Edge-Cache, X-Shield-Cache, X-Edge" always;
      add_header X-Edge $server_port always;
    }
    location / {
      if ($server_port = 8305) { set $limit_rate 100k; }
      proxy_pass $edge_upstream;
      proxy_set_header Host minio:9000;
      proxy_cache $zone;
      proxy_cache_valid 200 1d;
      add_header X-Edge-Cache $upstream_cache_status always;
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Expose-Headers "X-Edge-Cache, X-Shield-Cache, X-Edge" always;
      add_header X-Edge $server_port always;
    }
  }
}
