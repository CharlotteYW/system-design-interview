# YouTube lab: upload with presigned multipart, process into HLS, watch through a two-tier CDN.
#   app      :8300  API + page + S3 event consumer
#   worker   x2     probe, split, transcode (ffmpeg), manifests
#   minio    :9000  S3 API (originals, renditions, work buckets)
#   cdn      :8301-8305  nginx edges; the origin shield listens inside on 8390
services:
  app:
    build: .
    ports:
      - "8300:8000"
    environment: &env
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      S3_INTERNAL_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      CDN_INTERNAL_HOST: cdn
      LEASE_SECONDS: "8"
      IDEM_LAB: "1"
    volumes:
      - cdn_logs:/cdn-logs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      timeout: 5s
      retries: 40

  worker:
    build: .
    command: ["python", "-m", "src.worker"]
    environment: *env
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      app:
        condition: service_healthy

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      # S3 bucket events go to a Redis list. The app consumes "s3events".
      MINIO_NOTIFY_REDIS_ENABLE_YT: "on"
      MINIO_NOTIFY_REDIS_ADDRESS_YT: redis:6379
      MINIO_NOTIFY_REDIS_KEY_YT: s3events
      MINIO_NOTIFY_REDIS_FORMAT_YT: access
    volumes:
      - minio_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *200* ]]"]
      interval: 3s
      timeout: 3s
      retries: 30

  cdn:
    image: nginx:1.27-alpine
    ports:
      - "8301:8301"   # edge A, behind the shield
      - "8302:8302"   # edge B, behind the shield
      - "8303:8303"   # edge C, no shield (straight to origin)
      - "8304:8304"   # edge D, no shield (straight to origin)
      - "8305:8305"   # slow edge, behind the shield, about 0.8 Mbps
    volumes:
      - ./cdn/nginx.conf:/etc/nginx/nginx.conf:ro
      - cdn_logs:/logs
    depends_on:
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - yt_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  yt_pg:
  minio_data:
  cdn_logs:
