name: yelp-study

x-backend: &backend
  image: yelp-study-api:local
  build: .
  environment:
    DATABASE_URL: postgresql://app:app@postgres:5432/yelp
    REVIEW_QUEUE_LIMIT: "${YELP_QUEUE_LIMIT:-100}"
    REVIEW_QUEUE_MAX_AGE: "${YELP_QUEUE_MAX_AGE:-300}"
  depends_on:
    postgres:
      condition: service_healthy

services:
  frontend:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8440:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/static:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15

  worker:
    <<: *backend
    command: ["python", "-m", "src.worker"]

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: yelp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d yelp"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
