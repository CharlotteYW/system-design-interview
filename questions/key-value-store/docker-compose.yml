services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      L1_TTL_SECONDS: "1"
    volumes:
      - kvdata:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  kvdata:
