# Search autocomplete lab.
#   app      :8410  API + page. Trie and hash map live in memory.
#   postgres        yesterday's frequency, today's folded counts, the search log
services:
  app:
    build: .
    ports:
      - "8410:8000"
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      FOLD_SECONDS: "20"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      timeout: 5s
      retries: 40

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - ac_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  ac_pg:
